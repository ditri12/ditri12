name: run-script

on:
  workflow_dispatch:
    inputs:
      command:
        description: Shell command to run from the repository root
        required: true
        default: python lab-equipment-manufacturers/crawl/resolve_companies.py
      out:
        description: Directory whose changes are committed and uploaded
        required: true
        default: lab-equipment-manufacturers/research/enrich
      playwright:
        description: Install Playwright browsers (true/false)
        required: false
        default: "false"

permissions:
  contents: write


jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CMD: ${{ inputs.command }}
      OUT: ${{ inputs.out }}
      PW: ${{ inputs.playwright }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet requests beautifulsoup4 lxml playwright openpyxl
          if [ "$PW" = "true" ]; then python -m playwright install --with-deps chromium firefox; fi
      - name: Run
        run: bash -c "$CMD"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ github.run_id }}
          path: ${{ inputs.out }}
          retention-days: 14
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$OUT"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "enrich: $CMD"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
