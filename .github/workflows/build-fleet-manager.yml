name: Build FleetManager (Windows)

on:
  push:
    paths:
      - "fleet-management/**"
      - ".github/workflows/build-fleet-manager.yml"
    tags:
      - "fleet-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests (calculation + database)
        run: python -I -m unittest discover -s tests -v

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fleet-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Generate icon
        run: python build/make_icon.py build/icon.ico
      - name: Build single-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FleetManager --icon build/icon.ico fleet_manager.py
      - name: Smoke test (executable starts and exits)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\FleetManager.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "FleetManager.exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetManager-windows
          path: fleet-management/dist/FleetManager.exe
          if-no-files-found: error
      - name: Publish release (on fleet-v* tag)
        if: startsWith(github.ref, 'refs/tags/fleet-v')
        uses: softprops/action-gh-release@v2
        with:
          files: fleet-management/dist/FleetManager.exe
          name: ניהול צי רכב ${{ github.ref_name }}
          body: |
            קובץ הפעלה יחיד ל-Windows. הורידו את FleetManager.exe והפעילו - אין צורך בהתקנה.
            הנתונים נשמרים ב-%APPDATA%\FleetManager\fleet.db (ניתן לשינוי בהגדרות).
