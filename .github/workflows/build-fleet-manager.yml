name: Build FleetManager (Windows)

on:
  push:
    branches:
      - "**"
    tags:
      - "fleet-v*"
    paths:
      - "fleet-management/**"
      - ".github/workflows/build-fleet-manager.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests (calculation + database)
        run: python -I -m unittest discover -s tests -v
      - name: Probe the Ministry of Transport open-data API (informational)
        continue-on-error: true
        run: python build/check_gov_api.py

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fleet-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Generate icon
        run: python build/make_icon.py build/icon.ico
      - name: Build single-file executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FleetManager --icon build/icon.ico fleet_manager.py
      - name: Smoke test (executable starts and exits)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\FleetManager.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "FleetManager.exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Read application version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import fleet_app; print(fleet_app.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} /DSourceDir=..\dist build\installer.iss
          Get-ChildItem dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FleetManager-Setup
          path: fleet-management/dist/FleetManager-Setup-*.exe
          if-no-files-found: error
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: FleetManager-portable
          path: fleet-management/dist/FleetManager.exe
          if-no-files-found: error
      - name: Publish release fleet-v<version> (created or updated on every successful build)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fleet-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            fleet-management/dist/FleetManager-Setup-*.exe
            fleet-management/dist/FleetManager.exe
          name: ניהול צי רכב ${{ steps.ver.outputs.version }}
          body: |
            ## קבצי התקנה ל-Windows

            - **FleetManager-Setup-x.y.z.exe** - קובץ התקנה (מומלץ): מתקין את התוכנה, יוצר קיצור דרך בתפריט התחל ובשולחן העבודה, וכולל הסרה דרך "הוספה והסרה של תוכניות". לא נדרשות הרשאות מנהל.
            - **FleetManager.exe** - גרסה ניידת: קובץ יחיד שרץ בלי התקנה.

            בהפעלה הראשונה Windows עשוי להציג אזהרת SmartScreen (הקובץ אינו חתום דיגיטלית): לחצו "מידע נוסף" ואז "הפעל בכל זאת".

            הנתונים נשמרים ב-`%APPDATA%\FleetManager\fleet.db`. לעבודה משותפת של כמה מחשבים, בחרו בהגדרות קובץ נתונים בתיקייה משותפת ברשת.
