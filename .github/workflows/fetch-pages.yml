name: fetch-pages

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Path to the jobs JSON file
        required: true
        default: lab-equipment-manufacturers/crawl/jobs/lists.json
      out:
        description: Output directory (relative to repo root)
        required: true
        default: lab-equipment-manufacturers/research/sources/lists
      workers:
        description: Parallel HTTP workers
        required: false
        default: "4"
      render_workers:
        description: Parallel browser workers for rendered pages
        required: false
        default: "1"
      gzip:
        description: Store HTML gzipped (true/false)
        required: false
        default: "false"
      commit:
        description: Commit results to the branch (true/false)
        required: false
        default: "true"

permissions:
  contents: write


jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOBS: ${{ inputs.jobs }}
      OUT: ${{ inputs.out }}
      WORKERS: ${{ inputs.workers }}
      RENDER_WORKERS: ${{ inputs.render_workers }}
      GZIP: ${{ inputs.gzip }}
      DO_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: Fetch pages
        run: |
          extra=""
          if [ "$GZIP" = "true" ]; then extra="--gzip"; fi
          python lab-equipment-manufacturers/crawl/fetch.py --jobs "$JOBS" --out "$OUT" --workers "$WORKERS" --render-workers "${RENDER_WORKERS:-1}" $extra
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ github.run_id }}
          path: ${{ inputs.out }}
          retention-days: 14
      - name: Commit results
        if: env.DO_COMMIT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$OUT"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "crawl: $(basename "$JOBS" .json) -> $OUT"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
