<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספקי ציוד מעבדה</title>
<meta name="description" content="מאגר ספקי ציוד מעבדה המופיעים בקטלוגים של Dutscher, Thomas Scientific ו-Quartzy: ייצוג בישראל, גודל, מוצרים ואנשי קשר">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#5b6672;--line:#e3e6ea;--accent:#1f4e78;--accent-ink:#fff;--chip:#eef2f6;--ok:#1d7a46;--warn:#9a6b00;--bad:#9b2c2c;--info:#35557a;--soft:#f1f4f8;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1317;--card:#171c22;--ink:#e6e9ed;--muted:#9aa6b2;--line:#2a323b;--accent:#8ab4e8;--accent-ink:#0f1317;--chip:#222a33;--ok:#5fcf8a;--warn:#e0b45c;--bad:#f08a8a;--info:#9cc3f0;--soft:#1d242c;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f1317;--card:#171c22;--ink:#e6e9ed;--muted:#9aa6b2;--line:#2a323b;--accent:#8ab4e8;--accent-ink:#0f1317;--chip:#222a33;--ok:#5fcf8a;--warn:#e0b45c;--bad:#f08a8a;--info:#9cc3f0;--soft:#1d242c;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans Hebrew",sans-serif}
a{color:var(--accent)}
main.wrap{max-width:1500px;margin:0 auto;padding:16px}
main.wrap>*{min-width:0}
header h1{font-size:22px;margin:0 0 4px}
header p{margin:0;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:22px}
.kpi span{color:var(--muted);font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
.toolbar input[type=search],.toolbar select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.toolbar label.cb{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:13px}
.toolbar button{font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{color:var(--muted);font-size:13px;margin-inline-start:auto}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:900px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:right;overflow:hidden}
th{position:sticky;top:0;background:var(--soft);font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
th.c-id{width:46px}th.c-name{width:24%}th.c-country{width:9%}th.c-ind{width:14%}th.c-emp{width:9%}th.c-rev{width:11%}th.c-pres{width:14%}th.c-ent{width:19%}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--soft)}
tr.row.open td{background:var(--soft)}
td.num{white-space:normal;font-variant-numeric:tabular-nums}
.amt{white-space:nowrap}.yr{display:block;color:var(--muted);font-size:12px}
.sub{display:block;color:var(--muted);font-size:12px;direction:ltr;unicode-bidi:isolate;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.he{direction:rtl}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--chip);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:currentColor}.badge.warn{color:var(--warn);border-color:currentColor}.badge.bad{color:var(--bad);border-color:currentColor}.badge.info{color:var(--info);border-color:currentColor}
.cat{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:5px;background:var(--accent);color:var(--accent-ink);margin-inline-start:3px;vertical-align:middle}
.cat.d{background:#2f6f3e}.cat.t{background:#8a4b1f}.cat.q{background:#5a3f8f}.cat.qn{background:#9a6b00}
tr.details td{background:var(--soft);padding:12px 14px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.dgrid h4{margin:0 0 6px;font-size:14px;color:var(--muted)}
.dgrid ul{margin:0;padding-inline-start:18px}
.ecard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;background:var(--card)}
.ecard b{display:block}
.ecard .meta{color:var(--muted);font-size:12px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.more{display:block;margin:10px auto;padding:8px 16px}
footer{color:var(--muted);font-size:13px;margin:18px 0}
footer h3{font-size:14px;margin:12px 0 4px;color:var(--ink)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.strike{text-decoration:line-through;opacity:.7}
@media (max-width:700px){table{min-width:720px} .kpi b{font-size:18px}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <h1>ספקי ציוד מעבדה – מאגר נתונים</h1>
  <p id="subtitle"></p>
  <div class="legend" id="legend"></div>
</header>
<section class="kpis" id="kpis"></section>
<section class="toolbar">
  <input type="search" id="q" placeholder="חיפוש: שם ספק, מותג, נציג בישראל, מדינה…">
  <select id="catalog"><option value="">כל הקטלוגים</option><option value="dutscher">Dutscher</option><option value="thomassci">Thomas Scientific</option><option value="quartzy">Quartzy</option><option value="quartzy_new">Quartzy – חדשים</option><option value="multi">ביותר מקטלוג אחד</option></select>
  <select id="country"><option value="">כל המדינות</option></select>
  <select id="size"><option value="">כל הגדלים</option><option value="has">עם נתוני גודל</option><option value="big">1,000+ עובדים</option><option value="mid">100–999 עובדים</option><option value="small">עד 99 עובדים</option><option value="none">ללא נתון</option></select>
  <label class="cb"><input type="checkbox" id="verified"> רק מחקר מאומת</label>
  <button id="reset">איפוס</button>
  <button id="copy">העתק TSV</button>
  <span class="count" id="count"></span>
</section>
<div class="chips" id="chips"></div>
<section class="tablewrap">
<table id="tbl">
<thead><tr>
  <th class="c-id" data-k="id">#</th><th class="c-name" data-k="name">ספק / יצרן</th><th class="c-country" data-k="country_he">מדינה</th><th class="c-ind" data-k="industry">תחום</th>
  <th class="c-emp" data-k="emp">עובדים</th><th class="c-rev" data-k="rev">הכנסות</th><th class="c-pres" data-k="israel_presence">ייצוג בישראל</th><th class="c-ent" data-k="ents">נציגים בישראל</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
</section>
<button class="more" id="more" hidden>הצג עוד</button>
<footer id="foot"></footer>
</main>
<script id="data" type="application/json">__DATA_JSON__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ROWS = DATA.suppliers;
const PRES = DATA.israel_presence_values, CHECK = DATA.israel_check_values;
const CATS = DATA.catalogs;
const PRES_CLS = {subsidiary:'ok',distributor:'ok',parent_subsidiary:'info',none_found:'bad',unclear:'warn',not_found_in_sweep:'',pending:''};
const ETYPE = {subsidiary:'חברה-בת',distributor:'מפיץ',service:'שירות',office:'משרד'};
const ESTAT = {current:'עדכני',older_evidence:'ראיה ישנה',no_longer:'לא עוד',new:'חדש'};
const SRC_HE = {prior:'מחקר קודם מאומת',wikidata:'Wikidata',clearbit:'Clearbit (זיהוי דומיין)',manual:'ידני',site:'אתר החברה',catalog:'קטלוג',thomassci:'Thomas Scientific',dutscher:'Dutscher'};
const BASIS_HE = {prior_research:'מחקר קודם מאומת',distributor_site_sweep:'סריקת אתר המפיץ',manufacturer_or_press:'אתר היצרן / המפיץ / פרסום'};
const CONF_HE = {exact:'התאמה מדויקת',contained:'שם מופיע בשורה'};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n==null?'':Number(n).toLocaleString('en-US');
const yr = y => y?String(y).replace(/^FY\s*/i,'FY '):'';
function empOf(r){return r.employees?r.employees.value:null}
function revOf(r){return r.revenue?r.revenue.usd_m:null}
function catBadges(r){return Object.keys(CATS).filter(c=>r.catalogs[c]).map(c=>`<span class="cat ${c==='dutscher'?'d':c==='thomassci'?'t':c==='quartzy'?'q':'qn'}" title="${esc(CATS[c].name)}">${esc(CATS[c].short)}</span>`).join('')}
function entCell(r){
  const es=r.israel_entities||[]; if(!es.length) return '<span class="sub he">—</span>';
  return es.slice(0,3).map(e=>`<span class="sub ${/[֐-׿]/.test(e.name)?'he':''} ${e.status==='no_longer'?'strike':''}" title="${esc(e.name)}">${esc(e.name)}</span>`).join('')+(es.length>3?`<span class="sub he">+${es.length-3}</span>`:'');
}
function rowHtml(r){
  const e=r.employees, v=r.revenue;
  return `<tr class="row" data-id="${r.id}">
  <td>${r.id}</td>
  <td><b>${esc(r.name)}</b>${catBadges(r)}${r.prior_verified?' <span class="badge ok" title="נבדק במחקר הקודם">✓</span>':''}${r.parent?`<span class="sub" title="${esc(r.parent)}">${esc(r.parent)}</span>`:''}${r.website?`<span class="sub"><a href="${esc(r.website)}" target="_blank" rel="noopener">${esc(r.website.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a></span>`:''}</td>
  <td>${esc(r.country_he||'')}</td>
  <td><span class="sub he" title="${esc(r.industry||r.description||'')}">${esc(r.industry||(r.description?r.description.slice(0,60):''))}</span></td>
  <td class="num">${e?`<span class="amt">${fmt(e.value)}</span><span class="yr">${yr(e.year)}${e.scope&&e.scope!=='company'?' · '+esc(e.scope):''}</span>`:'<span class="yr">לא פורסם</span>'}</td>
  <td class="num">${v&&v.usd_m!=null?`<span class="amt">$${fmt(Math.round(v.usd_m))}M</span><span class="yr">${yr(v.year)}${v.scope&&v.scope!=='company'?' · '+esc(v.scope):''}</span>`:(v&&v.original?`<span class="amt">${esc(v.original)}</span><span class="yr">${yr(v.year)}</span>`:'<span class="yr">לא פורסם</span>')}</td>
  <td><span class="badge ${PRES_CLS[r.israel_presence]||''}">${esc(PRES[r.israel_presence]||r.israel_presence)}</span><span class="sub he">${esc(CHECK[r.israel_check]||'')}${r.israel_evidence_year?' · ראיה מ-'+r.israel_evidence_year:''}</span></td>
  <td>${entCell(r)}</td></tr>`;
}
function detailHtml(r){
  const prods=(r.products||[]).map(p=>`<li><b>${esc(p.name)}</b>${p.desc?' – '+esc(p.desc):''}${p.url?` <a href="${esc(p.url)}" target="_blank" rel="noopener">↗</a>`:''} <span class="meta sub he" style="display:inline">${esc(SRC_HE[p.source]||p.source||'')}</span></li>`).join('')||'<li>טרם נאספו מוצרים</li>';
  const ents=(r.israel_entities||[]).map(e=>`<div class="ecard"><b>${esc(e.name)}${e.name_he?' · '+esc(e.name_he):''} <span class="badge">${esc(ETYPE[e.type]||e.type||'')}</span> ${e.status?`<span class="badge ${e.status==='current'?'ok':e.status==='no_longer'?'bad':'warn'}">${esc(ESTAT[e.status]||e.status)}</span>`:''}${e.evidence_year?`<span class="badge">ראיה מ-${e.evidence_year}</span>`:''}</b>
    ${e.scope?`<div class="meta">${esc(e.scope)}</div>`:''}
    <dl>${e.website?`<dt>אתר</dt><dd><a class="ltr" href="${esc(e.website)}" target="_blank" rel="noopener">${esc(e.website)}</a></dd>`:''}${e.phone?`<dt>טלפון</dt><dd><a class="ltr" href="tel:${esc(e.phone.replace(/[^+\d]/g,''))}">${esc(e.phone)}</a></dd>`:''}${e.email?`<dt>דוא"ל</dt><dd><a class="ltr" href="mailto:${esc(e.email)}">${esc(e.email)}</a></dd>`:''}${e.address?`<dt>כתובת</dt><dd>${esc(e.address)}</dd>`:''}${e.contact_url?`<dt>יצירת קשר</dt><dd><a class="ltr" href="${esc(e.contact_url)}" target="_blank" rel="noopener">${esc(e.contact_url)}</a></dd>`:''}
    <dt>בסיס</dt><dd>${esc(BASIS_HE[e.match_basis]||e.match_basis||'')}${e.match_confidence?' · '+esc(CONF_HE[e.match_confidence]||e.match_confidence):''}${e.match_text?` · «<span class="ltr">${esc(e.match_text)}</span>»`:''}</dd>
    ${e.source?`<dt>מקור</dt><dd><a class="ltr" href="${esc(e.source)}" target="_blank" rel="noopener">${esc(e.source)}</a></dd>`:''}</dl></div>`).join('')||'<div class="meta">לא נמצאו נציגים בישראל במקורות שנסרקו.</div>';
  const e=r.employees, v=r.revenue, c=r.contact||{};
  const cats=Object.keys(CATS).filter(k=>r.catalogs[k]).map(k=>`<li><a href="${esc(r.catalogs[k].url||CATS[k].url)}" target="_blank" rel="noopener">${esc(CATS[k].name_he)}</a>${r.catalogs[k].own_brand?' (מותג-בית)':''}</li>`).join('');
  return `<tr class="details"><td colspan="8"><div class="dgrid">
  <div><h4>על הספק</h4>${r.description?`<p style="margin:0 0 8px">${esc(r.description)}</p>`:''}<dl>
    ${r.aka?`<dt>ידוע גם כ</dt><dd>${esc(r.aka)}</dd>`:''}${r.website?`<dt>אתר</dt><dd><a class="ltr" href="${esc(r.website)}" target="_blank" rel="noopener">${esc(r.website)}</a> <span class="meta">(${esc(SRC_HE[r.website_source]||r.website_source||'')})</span></dd>`:(r.website_candidate?`<dt>אתר (לאימות)</dt><dd><a class="ltr" href="${esc(r.website_candidate)}" target="_blank" rel="noopener">${esc(r.website_candidate)}</a> <span class="meta">זיהוי אוטומטי, ביטחון ${Math.round((r.website_candidate_score||0)*100)}%</span></dd>`:'')}
    ${r.country?`<dt>מדינה</dt><dd>${esc(r.country_he||r.country)}${r.hq?' · '+esc(r.hq):''}</dd>`:''}${r.parent?`<dt>חברת-אם</dt><dd>${esc(r.parent)}</dd>`:''}${r.ownership?`<dt>בעלות</dt><dd>${esc(r.ownership)}</dd>`:''}${r.inception?`<dt>נוסדה</dt><dd>${esc(r.inception)}</dd>`:''}${r.industry?`<dt>תחום</dt><dd>${esc(r.industry)}</dd>`:''}
    ${r.wikidata?`<dt>Wikidata</dt><dd><a class="ltr" href="https://www.wikidata.org/wiki/${esc(r.wikidata)}" target="_blank" rel="noopener">${esc(r.wikidata)}</a></dd>`:''}</dl>
    <h4 style="margin-top:10px">מופיע בקטלוגים</h4><ul>${cats}</ul></div>
  <div><h4>מוצרים מובילים / מייצגים</h4><ul>${prods}</ul>
    <h4 style="margin-top:10px">גודל</h4><dl>
    <dt>עובדים</dt><dd>${e?`${fmt(e.value)} (${yr(e.year)||'ללא שנה'}${e.scope&&e.scope!=='company'?', '+esc(e.scope):''}; ${esc(SRC_HE[e.source]||e.source||'')})${e.note?`<div class="meta">${esc(e.note)}</div>`:''}`:'לא פורסם'}</dd>
    <dt>הכנסות</dt><dd>${v?`${v.usd_m!=null?'$'+fmt(Math.round(v.usd_m))+'M':''}${v.original?' · '+esc(v.original):''} (${yr(v.year)||'ללא שנה'}${v.scope&&v.scope!=='company'?', '+esc(v.scope):''}; ${esc(SRC_HE[v.source]||v.source||'')})${v.note?`<div class="meta">${esc(v.note)}</div>`:''}`:'לא פורסם'}</dd>
    <dt>בסיס</dt><dd>${esc(r.size_basis||'')}</dd></dl>
    <h4 style="margin-top:10px">יצירת קשר – היצרן</h4><dl>
    ${c.phone?`<dt>טלפון</dt><dd><a class="ltr" href="tel:${esc(c.phone.replace(/[^+\d]/g,''))}">${esc(c.phone)}</a></dd>`:''}${c.email?`<dt>דוא"ל</dt><dd><a class="ltr" href="mailto:${esc(c.email)}">${esc(c.email)}</a></dd>`:''}${c.address?`<dt>כתובת</dt><dd>${esc(c.address)}</dd>`:''}${c.contact_url?`<dt>דף קשר</dt><dd><a class="ltr" href="${esc(c.contact_url)}" target="_blank" rel="noopener">${esc(c.contact_url)}</a></dd>`:''}${!(c.phone||c.email||c.contact_url)?'<dt>—</dt><dd>טרם נאספו פרטי קשר</dd>':''}${c.note?`<dt>הערה</dt><dd class="meta">${esc(c.note)}</dd>`:''}</dl></div>
  <div><h4>ייצוג בישראל: ${esc(PRES[r.israel_presence]||'')} <span class="badge">${esc(CHECK[r.israel_check]||'')}</span></h4>${r.israel_note?`<div class="meta" style="margin-bottom:6px">${esc(r.israel_note)}</div>`:''}${ents}
    <h4 style="margin-top:10px">מקורות</h4><ul>${(r.sources||[]).slice(0,12).map(s=>`<li><a class="ltr" href="${esc(s)}" target="_blank" rel="noopener">${esc(s.length>80?s.slice(0,80)+'…':s)}</a></li>`).join('')}</ul></div>
  </div></td></tr>`;
}
// state
const state={q:'',catalog:'',country:'',size:'',verified:false,pres:new Set(),sort:'id',dir:1,shown:300};
const $=s=>document.querySelector(s);
function matches(r){
  if(state.catalog==='multi'){if(r.n_catalogs<2)return false}else if(state.catalog&&!r.catalogs[state.catalog])return false;
  if(state.country&&r.country_he!==state.country)return false;
  if(state.verified&&!r.prior_verified)return false;
  if(state.pres.size&&!state.pres.has(r.israel_presence))return false;
  const emp=empOf(r);
  if(state.size==='has'&&!(r.employees||r.revenue))return false;
  if(state.size==='big'&&!(emp>=1000))return false;
  if(state.size==='mid'&&!(emp>=100&&emp<1000))return false;
  if(state.size==='small'&&!(emp!=null&&emp<100))return false;
  if(state.size==='none'&&(r.employees||r.revenue))return false;
  if(state.q){const q=state.q.toLowerCase();const hay=[r.name,...(r.names||[]),r.aka,r.country,r.country_he,r.parent,r.industry,r.description,...(r.israel_entities||[]).map(e=>e.name+' '+(e.name_he||'')),...(r.products||[]).map(p=>p.name)].join(' ').toLowerCase();if(!hay.includes(q))return false}
  return true;
}
function sortVal(r,k){switch(k){case 'emp':return empOf(r)??-1;case 'rev':return revOf(r)??-1;case 'ents':return (r.israel_entities||[]).length;case 'israel_presence':return ['subsidiary','distributor','parent_subsidiary','unclear','not_found_in_sweep','none_found','pending'].indexOf(r.israel_presence);default:return r[k]??''}}
let filtered=[];
function render(){
  filtered=ROWS.filter(matches);
  const k=state.sort,d=state.dir;
  filtered.sort((a,b)=>{const x=sortVal(a,k),y=sortVal(b,k);return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'he'))*d});
  const tb=$('#tbody');tb.innerHTML=filtered.slice(0,state.shown).map(rowHtml).join('');
  $('#count').textContent=`${filtered.length.toLocaleString('en-US')} מתוך ${ROWS.length.toLocaleString('en-US')} ספקים`;
  $('#more').hidden=filtered.length<=state.shown;
}
function kpis(){
  const n=ROWS.length,il=ROWS.filter(r=>['subsidiary','distributor','parent_subsidiary'].includes(r.israel_presence)).length;
  const web=ROWS.filter(r=>r.website).length,sz=ROWS.filter(r=>r.employees||r.revenue).length,pr=ROWS.filter(r=>(r.products||[]).length).length,multi=ROWS.filter(r=>r.n_catalogs>1).length,ct=ROWS.filter(r=>r.contact&&(r.contact.phone||r.contact.email)).length;
  $('#kpis').innerHTML=[[n,'ספקים/יצרנים'],[multi,'ביותר מקטלוג אחד'],[il,'עם ערוץ ישראלי שנמצא'],[web,'עם אתר מזוהה'],[sz,'עם נתוני גודל'],[pr,'עם מוצרים'],[ct,'עם פרטי קשר']].map(([v,l])=>`<div class="kpi"><b>${v.toLocaleString('en-US')}</b><span>${l}</span></div>`).join('');
  $('#subtitle').textContent=`${n.toLocaleString('en-US')} ספקים ויצרנים שמופיעים בדפי הספקים/המותגים של Dutscher, Thomas Scientific ו-Quartzy · עודכן ${DATA.generated}`;
  $('#legend').innerHTML=Object.keys(CATS).map(k=>`<span><span class="cat ${k==='dutscher'?'d':k==='thomassci'?'t':k==='quartzy'?'q':'qn'}">${esc(CATS[k].short)}</span> <a href="${esc(CATS[k].url)}" target="_blank" rel="noopener">${esc(CATS[k].name_he)}</a> (${ROWS.filter(r=>r.catalogs[k]).length})</span>`).join('')+'<span><span class="badge ok">✓</span> נבדק לעומק במחקר הקודם</span>';
  const cs=[...new Set(ROWS.map(r=>r.country_he).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he'));
  $('#country').innerHTML='<option value="">כל המדינות</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join('');
  $('#chips').innerHTML=Object.keys(PRES).map(p=>`<span class="chip" data-p="${p}">${esc(PRES[p])} (${ROWS.filter(r=>r.israel_presence===p).length})</span>`).join('');
}
document.addEventListener('click',ev=>{
  const chip=ev.target.closest('.chip');if(chip){const p=chip.dataset.p;state.pres.has(p)?state.pres.delete(p):state.pres.add(p);chip.classList.toggle('on');render();return}
  const th=ev.target.closest('th[data-k]');if(th){const k=th.dataset.k;if(state.sort===k)state.dir*=-1;else{state.sort=k;state.dir=k==='emp'||k==='rev'||k==='ents'?-1:1}render();return}
  const row=ev.target.closest('tr.row');if(row&&!ev.target.closest('a')){const open=row.classList.contains('open');document.querySelectorAll('tr.details').forEach(x=>x.remove());document.querySelectorAll('tr.row.open').forEach(x=>x.classList.remove('open'));if(!open){row.classList.add('open');const r=ROWS.find(x=>x.id==row.dataset.id);row.insertAdjacentHTML('afterend',detailHtml(r))}}
});
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim();state.shown=300;render()});
$('#catalog').addEventListener('change',e=>{state.catalog=e.target.value;render()});
$('#country').addEventListener('change',e=>{state.country=e.target.value;render()});
$('#size').addEventListener('change',e=>{state.size=e.target.value;render()});
$('#verified').addEventListener('change',e=>{state.verified=e.target.checked;render()});
$('#reset').addEventListener('click',()=>{state.q='';state.catalog='';state.country='';state.size='';state.verified=false;state.pres.clear();state.shown=300;$('#q').value='';$('#catalog').value='';$('#country').value='';$('#size').value='';$('#verified').checked=false;document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));render()});
$('#more').addEventListener('click',()=>{state.shown+=300;render()});
$('#copy').addEventListener('click',()=>{const h=['#','ספק','קטלוגים','אתר','מדינה','חברת-אם','עובדים','שנה','הכנסות $M','שנה','ייצוג בישראל','בדיקה','נציגים','מוצרים','טלפון','דוא"ל'];const lines=[h.join('\t')].concat(filtered.map(r=>[r.id,r.name,Object.keys(CATS).filter(c=>r.catalogs[c]).map(c=>CATS[c].short).join('+'),r.website||'',r.country_he||'',r.parent||'',empOf(r)??'',r.employees?r.employees.year||'':'',revOf(r)??'',r.revenue?r.revenue.year||'':'',PRES[r.israel_presence],CHECK[r.israel_check],(r.israel_entities||[]).map(e=>e.name).join('; '),(r.products||[]).map(p=>p.name).join('; '),(r.contact||{}).phone||'',(r.contact||{}).email||''].map(v=>String(v).replace(/\t|\n/g,' ')).join('\t')));navigator.clipboard.writeText(lines.join('\n')).then(()=>{$('#copy').textContent='הועתק ✓';setTimeout(()=>$('#copy').textContent='העתק TSV',1500)})});
$('#foot').innerHTML=`<h3>מתודולוגיה</h3>
<p><b>אוכלוסייה.</b> כל הספקים/המותגים המופיעים בדפי הספקים של Dutscher (brands), Thomas Scientific (browse-by/suppliers) ו-Quartzy (suppliers, new-suppliers) נכון ל-${DATA.generated}. שמות זהים בקטלוגים שונים אוחדו לרשומה אחת (נרמול שמות: סיומות תאגידיות, סימני רישום).</p>
<p><b>ייצוג בישראל.</b> "מפיץ/נציג" מסומן כאשר שם הספק מופיע בדפי המותגים/הספקים של מפיץ ישראלי שנסרקו (${(DATA.israeli_entities_index||[]).length} גופים ישראליים במאגר), או כאשר אומת במחקר הקודם מול אתר היצרן. "לא נמצא בסריקת המפיצים" פירושו שהשם לא נמצא באתרי המפיצים שנסרקו – לא הוכחה להיעדר ייצוג. "ראיה מ-שנה" מציין את שנת העדות העדכנית ביותר.</p>
<p><b>גודל.</b> עובדים והכנסות מדיווחים רשמיים (מחקר קודם) או מ-Wikidata עם שנת הנתון; המרה לדולר לפי שערי 2026 מקורבים. "לא פורסם" – לא נמצא נתון פומבי (רוב החברות הפרטיות הקטנות).</p>
<p><b>מוצרים.</b> שלושה מוצרים מובילים מהמחקר הקודם (יצרנים גדולים) או מוצרים מייצגים כפי שמופיעים בקטלוגים.</p>
<p><b>פרטי קשר.</b> כתובות דוא"ל כלליות בלבד (info@/sales@), ללא כתובות אישיות. טלפונים שמקורם במדריכים עסקיים מסומנים לאימות.</p>`;
kpis();render();
</script>
</body>
</html>
